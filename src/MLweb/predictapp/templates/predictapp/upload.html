{% extends "predictapp/base.html" %}

{% block title %}Upload CSV — Score Advisor{% endblock %}

{% block content %}
<h2>⬆️ Upload CSV Mới</h2>
<div class="card">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label style="display:block; margin-bottom: 12px; background:none; padding:0;">
            Chọn file CSV:
        </label>
        <input type="file" name="csvfile" accept=".csv" required>

        <button type="submit" class="btn">Upload</button>
    </form>

    {% if msg %}
        <div class="alert {% if 'thành công' in msg %}alert-success{% else %}alert-error{% endif %}" style="margin-top:16px;">
            {{ msg }}
        </div>
    {% endif %}
</div>
{% endblock %}
